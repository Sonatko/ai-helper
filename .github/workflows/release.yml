name: Release AI Helper

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: |
          npm install
          npm --prefix frontend install

      - name: Build and Publish Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Helper ${{ github.ref_name }}'
          releaseBody: |
            ## 🌍 AI Helper — Native Windows AI Assistant

            ### 🇬🇧 English
            - **`AI-Helper_..._x64-setup.exe`** — Recommended Windows NSIS installer (creates Start Menu & Desktop shortcuts).
            - **`ai-helper.exe` / `.zip`** — Standalone portable edition: download and run directly.
            - **Shortcuts:** `F7` — Smart Summon (active window context & screenshot) | `Alt+F7` — Screen Snip.

            ---

            ### 🇷🇺 Русский
            - **`AI-Helper_..._x64-setup.exe`** — Рекомендуемый установщик Windows (создает ярлыки в меню «Пуск» и на Рабочем столе).
            - **`ai-helper.exe` / `.zip`** — Портативная версия без установки: скачал и сразу запустил.
            - **Горячие клавиши:** `F7` — Смарт-вызов (контекст активного окна и снимок) | `Alt+F7` — Снимок области экрана.
          releaseDraft: false
          prerelease: false

[package]
name = "ai-helper"
version = "0.1.2"
description = "Native lightweight Windows AI assistant"
edition = "2021"

[lib]
name = "ai_helper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# Tauri build-time code generator and Windows manifest linker
tauri-build = { version = "2", features = [] }

[dependencies]
# Core Tauri v2 framework with System Tray support
tauri = { version = "2", features = ["tray-icon"] }

# Official global hotkey registration plugin (RegisterHotKey Win32 API)
tauri-plugin-global-shortcut = "2"

# Single instance enforcement: gracefully focuses existing window if second process launched
tauri-plugin-single-instance = "2"

# High-performance serialization framework (needed for IPC data transfer)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime for non-blocking timers and streaming
tokio = { version = "1", features = ["time"] }

# Base64 encoding for passing in-memory screenshot to UI and AI
base64 = "0.22"

# In-memory JPEG compressor (minimal footprint, fast encoding)
image = { version = "0.25", default-features = false, features = ["jpeg"] }

# Embedded zero-dependency SQLite database (bundled directly into binary, WAL-mode enabled)
rusqlite = { version = "0.33", features = ["bundled"] }

# Official Microsoft Win32 API bindings (zero overhead, sub-millisecond calls)
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
]

# Optimize JPEG encoding performance in dev mode (reduces encoding time from 250ms to 8ms)
[profile.dev.package.image]
opt-level = 3



<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Helper</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main id="app" class="launcher-container" data-tauri-drag-region>
      <!-- Top Capsule Bar: Always visible (height: 60px) -->
      <header class="launcher-bar" data-tauri-drag-region>
        <input
          type="text"
          id="query-input"
          class="query-input"
          placeholder="Спроси что угодно... (Enter для отправки)"
          autofocus
          autocomplete="off"
          spellcheck="false"
        />
        <div class="capsule-actions">
          <div id="badge-pill" class="badge-pill hidden">
            <span id="badge-pill-text"></span>
            <div id="badge-preview-popup" class="badge-preview-popup hidden">
              <img id="badge-preview-img" src="" alt="Preview" />
            </div>
          </div>
          <div id="thread-pill" class="thread-pill hidden" title="Активный диалог (Ctrl+N — начать новый)">
            <span id="thread-text">💬 Ветка</span>
            <span id="thread-reset-btn" class="thread-reset" title="Начать чистый диалог (Ctrl+N)">✕</span>
          </div>
          <button id="capsule-history-btn" class="capsule-circle-btn" title="История запросов (Ctrl+H)">🕒</button>
        </div>
      </header>

      <!-- Slash Command Autocomplete Popup -->
      <div id="commands-popup" class="commands-popup hidden"></div>

      <div class="divider"></div>

      <!-- Mode 1: History Panel (Dedicated Full Expanded View) -->
      <section id="history-panel" class="content-panel hidden">
        <div class="panel-header">
          <span>🕒 История предыдущих диалогов</span>
          <button id="clear-history-btn" class="text-btn">Очистить всё</button>
        </div>
        <div id="history-list" class="history-list"></div>
        <footer class="panel-footer">
          <span style="color: #64748b;">Кликните диалог для просмотра</span>
          <span class="esc-hint">Esc — закрыть</span>
        </footer>
      </section>

      <!-- Mode 2: Response Panel (Dedicated Full Expanded View) -->
      <section id="response-panel" class="content-panel hidden">
        <div id="response-content" class="response-content"></div>
        <footer class="action-bar">
          <div class="status-group">
            <span id="status-indicator" class="status-indicator"></span>
            <div id="token-meter" class="token-meter">
              <span id="token-count">⚡ 0 токенов</span>
              <div class="quota-progress-container">
                <div id="quota-progress-bar" class="quota-progress-bar"></div>
              </div>
              <span id="quota-text">Общий пул</span>
            </div>
          </div>
          <div class="action-buttons">
            <button id="copy-btn" class="action-btn" title="Скопировать ответ">Скопировать</button>
            <span class="esc-hint">Esc — скрыть</span>
          </div>
        </footer>
      </section>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
